<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('theme')
        const savedSegment = localStorage.getItem('segment')

        const theme =
          savedTheme ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light')

        const segment = savedSegment || 'retail'

        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.segment = segment
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>Meridian Banking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
